# ESP Autobuild: builds both ESP32 targets on every push/PR and runs the
# native Unity host tests. Artifacts: firmware.bin per target.
#
# Pinning: actions are pinned by immutable commit SHA (release tag immutability
# rule). SHAs verified via `git ls-remote https://github.com/<repo> refs/tags/v4`:
#   checkout v4          11d5960a326750d5838078e36cf38b85af677262
#   setup-python v4      7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
#   cache v4             0057852bfaa89a56745cba8c7296529d2fc39830
#   upload-artifact v4   ea165f8d65b6e75b540449e92b4886f43607fa02
#
# NOTE: `main` only builds the ESP32-C3 env until the multi-arch work lands.
# Once merged, remove `docs/fork-state` from the push trigger list.
name: ESP Autobuild

on:
  push:
    branches: [main, docs/fork-state]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32-C3 (C3-Zero)
        run: pio run -e esp32-c3-devkitm-1

      - name: Build ESP32 classic (D0WD)
        run: pio run -e esp32dev

      - name: Native host tests (Unity)
        run: pio test -e native

      - name: Upload firmware (ESP32-C3)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-esp32-c3
          path: .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload firmware (ESP32 classic)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-esp32-classic
          path: .pio/build/esp32dev/firmware.bin
