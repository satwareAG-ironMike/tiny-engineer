# ESP Autobuild: builds both ESP32 targets on every push/PR and runs the
# native Unity host tests. Artifacts: firmware.bin per target.
#
# Pinning: actions are pinned by immutable commit SHA (release tag immutability
# rule). v5 (Node 24) to avoid the Node 20 deprecation annotation. SHAs
# verified via `git ls-remote https://github.com/<repo> refs/tags/v5`:
#   checkout v5          fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   setup-python v5      a26af69be951a213d495a4c3e4e4022e16d87065
#   cache v5             caa296126883cff596d87d8935842f9db880ef25
#   upload-artifact v5   330a01c490aca151604b8cf639adc76d48f6c5d4
#
# NOTE: `main` only builds the ESP32-C3 env until the multi-arch work lands.
# Once merged, remove `docs/fork-state` from the push trigger list.
name: ESP Autobuild

on:
  push:
    branches: [main, docs/fork-state]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32-C3 (C3-Zero)
        run: pio run -e esp32-c3-devkitm-1

      - name: Build ESP32 classic (D0WD)
        run: pio run -e esp32dev

      - name: Native host tests (Unity)
        run: pio test -e native

      - name: Upload firmware (ESP32-C3)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: firmware-esp32-c3
          path: .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload firmware (ESP32 classic)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: firmware-esp32-classic
          path: .pio/build/esp32dev/firmware.bin
