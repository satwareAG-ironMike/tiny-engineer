# ESP Autobuild: builds both ESP32 targets on every push/PR and runs the
# native Unity host tests. Artifacts: firmware.bin per target.
#
# Pinning: actions are pinned by immutable commit SHA (release tag immutability
# rule), on Node 24 builds where the publisher offers them, to keep the
# runs free of "Node.js 20 is deprecated" annotations. SHAs verified via
# `git ls-remote https://github.com/<repo> refs/tags/<v>`:
#   checkout v5          fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  (node24)
#   setup-python v5      a26af69be951a213d495a4c3e4e4022e16d87065  (node20: no node24 tag exists in the v5 line yet - annotation unavoidable until the action publishes one)
#   cache v5             caa296126883cff596d87d8935842f9db880ef25  (node24)
#   upload-artifact v6   b7c566a772e6b6bfb58ed0dc250532a479d7789f  (node24)
name: ESP Autobuild

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ESP32-C3 (C3-Zero)
        run: pio run -e esp32-c3-devkitm-1

      - name: Build ESP32 classic (D0WD)
        run: pio run -e esp32dev

      - name: Native host tests (Unity)
        run: pio test -e native

      - name: Upload firmware (ESP32-C3)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firmware-esp32-c3
          path: .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload firmware (ESP32 classic)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firmware-esp32-classic
          path: .pio/build/esp32dev/firmware.bin
