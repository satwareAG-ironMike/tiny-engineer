; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =====================================================
; Multi-architecture targets
; =====================================================
; Both environments build the same source tree; chip-specific pin maps
; and APIs are selected at compile time (discriminator:
; CONFIG_IDF_TARGET_ESP32C3) in include/pins.h, src/hardware/rgb.cpp
; and src/hardware/chip_temp.cpp.
;
;   esp32-c3-devkitm-1 -> Waveshare ESP32-C3-Zero (RISC-V, onboard WS2812)
;   esp32dev           -> classic dual-core ESP32 devkit (D0WD-V3)
;
; Build:   pio run -e esp32-c3-devkitm-1 -e esp32dev
;           (always pass -e: bare "pio run" also targets the host test env)
; Flash:   pio run -e esp32dev -t upload --upload-port /dev/ttyUSB0
; Test:    pio test -e native  (host-side Unity tests, test/test_native/)

[env]
; Arduino-ESP32 3.x (ESP_I2S); official PIO platform stays on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/copy_assets.py
    post:scripts/upload_fs_after_upload.py

[env:esp32-c3-devkitm-1]
; Waveshare ESP32-C3-Zero (RISC-V): native USB serial, onboard WS2812.
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
; Classic dual-core ESP32 (D0WD-V3): UART0 via USB-serial bridge,
; no onboard WS2812.
board = esp32dev

[env:native]
; Host-side unit tests (PlatformIO Unity). Compiles pure, Arduino-free
; modules from src/ directly inside the test files (test/test_native/).
; Inherited [env] keys that do not apply to a host build are cleared.
platform = native
framework =
lib_deps =
board_build.partitions =
board_build.filesystem =
extra_scripts =
test_framework = unity
test_build_src = off
build_flags =
    -std=gnu++17
    -I src
    -I include
